# Grafana values: CloudWatch datasource, IRSA, dashboards
# Region and IRSA role are injected via Terraform

serviceAccount:
  create: true
  name: grafana
  annotations:
    eks.amazonaws.com/role-arn: ${grafana_irsa_arn}

# Required for IRSA: Grafana runs as user 472, needs to read projected credentials
podSecurityContext:
  fsGroup: 472
  runAsUser: 472
  runAsGroup: 472
  runAsNonRoot: true

securityContext:
  runAsUser: 472
  runAsGroup: 472
  runAsNonRoot: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CloudWatch
        type: cloudwatch
        access: proxy
        isDefault: true
        uid: cloudwatch
        jsonData:
          authType: default
          defaultRegion: ${region}

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    # AWS EKS dashboard from Grafana.com (uses CloudWatch)
    eks-aws:
      gnetId: 20577
      revision: 1
      datasource: CloudWatch
